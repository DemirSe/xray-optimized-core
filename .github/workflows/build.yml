name: trimmed-build
on:
  push:
    branches: [trimmed, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: build
        run: go build -trimpath -ldflags="-s -w -buildid=" -o xray-trimmed ./main
      - name: functional checks
        run: |
          ./xray-trimmed version
          ./xray-trimmed uuid
          echo '{"inbounds":[{"port":1443,"protocol":"vless","settings":{"clients":[{"id":"11111111-1111-4111-8111-111111111111","flow":"xtls-rprx-vision"}],"decryption":"none"},"streamSettings":{"network":"tcp"}}],"outbounds":[{"protocol":"freedom"}]}' > /tmp/cfg.json
          ./xray-trimmed run -test -c /tmp/cfg.json
          echo '{"inbounds":[{"port":1443,"protocol":"vmess","settings":{}}],"outbounds":[{"protocol":"freedom"}]}' > /tmp/bad.json
          if ./xray-trimmed run -test -c /tmp/bad.json; then echo "FAIL: vmess accepted"; exit 1; else echo "OK: vmess rejected"; fi
          sha256sum xray-trimmed | tee sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xray-trimmed-linux-amd64
          path: |
            xray-trimmed
            sha256.txt
